server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  data:
    redis:
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      #password: ${sky.redis.password}
      database: ${sky.redis.database}


mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥（必须 >= 32 字符以满足 HMAC-SHA256 安全要求）
    admin-secret-key: sky-take-out-admin-secret-key-2024-min-32-chars!!
    # 设置jwt过期时间
    admin-ttl: 7200000000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: sky-take-out-user-secret-key-2024-safe-and-secure!!!
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}

langchain4j:
  open-ai:
    chat-model:
      base-url: https://open.bigmodel.cn/api/paas/v4/
      api-key: ${sky.open-ai.api-key}
      model-name: glm-4.5-air
      temperature: 0.7
      max-tokens: 4000
      timeout: 60s
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://open.bigmodel.cn/api/paas/v4/
      api-key: ${sky.open-ai.api-key}
      model-name: glm-4.5-air
      temperature: 0.7
      max-tokens: 4000
      timeout: 60s
    embedding-model:
      base-url: https://open.bigmodel.cn/api/paas/v4/
      api-key: ${sky.open-ai.api-key}
      model-name: embedding-3